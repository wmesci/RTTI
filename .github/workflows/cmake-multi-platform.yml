name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, build_type: Debug, cc: clang, cxx: clang++ }
          - { os: macos-14, build_type: Release, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, build_type: Debug, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, build_type: Release, cc: clang, cxx: clang++ }
          - { os: windows-latest, build_type: Debug, cc: cl, cxx: cl }
          - { os: windows-latest, build_type: Release, cc: cl, cxx: cl }

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DRTTI_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --no-tests=error

  sanitizers:
    name: ${{ matrix.sanitizer }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, sanitizer: "address,undefined" }
          - { os: macos-14, sanitizer: "address,undefined" }
          - { os: ubuntu-latest, sanitizer: thread }

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DRTTI_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

  no-rtti:
    name: -fno-rtti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRTTI_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-fno-rtti"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  no-exceptions:
    name: -fno-exceptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DRTTI_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fno-exceptions -DRTTI_NO_EXCEPTIONS"
      - name: Build
        run: cmake --build build --parallel 4

  install-consumer:
    name: install + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRTTI_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/prefix"
      - name: Build consumer
        run: >
          cmake -S tests/consumer -B consumer-build
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"
      - name: Run consumer
        run: cmake --build consumer-build --parallel 4 && ./consumer-build/rtti_consumer
